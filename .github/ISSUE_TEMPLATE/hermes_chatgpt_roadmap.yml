name: Hermes for ChatGPT roadmap work
description: Track work that advances the Hermes ↔ ChatGPT product roadmap.
title: "[Hermes ChatGPT] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for product work governed by PROJECT.md, STATE.md, ROADMAP.md, and ARCHITECTURE.md.

  - type: dropdown
    id: milestone
    attributes:
      label: Roadmap milestone
      options:
        - M0 — Architecture and Contract
        - M1 — Hermes Remote Control
        - M2 — Private ChatGPT Control
        - M3 — Production Identity and Isolation
        - M4 — Private/Public Convergence
        - M5 — Release Candidate
        - M6 — Published Product
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options:
        - Shared core
        - Private/canary
        - Public/stable
        - Hermes runtime integration
        - Nous Portal integration
        - Infrastructure
    validations:
      required: true

  - type: textarea
    id: capability
    attributes:
      label: Capability advanced
      description: What end-user or platform capability does this move forward?
      placeholder: Describe the capability and why it belongs in this milestone.
    validations:
      required: true

  - type: textarea
    id: end_state
    attributes:
      label: End-state compatibility
      description: Explain how this fits the shared control plane and avoids private-only rewrite debt.
    validations:
      required: true

  - type: textarea
    id: temporary_debt
    attributes:
      label: Temporary infrastructure or debt
      description: List any private-only configuration or shortcuts and how they will be replaced/removed.
      placeholder: None, or describe the replacement path.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define observable behavior required to call this work complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Tests, commands, or end-to-end flows that will prove the acceptance criteria.
    validations:
      required: true

  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: I checked PROJECT.md, STATE.md, ROADMAP.md, and ARCHITECTURE.md before proposing this work.
          required: true
        - label: This work does not put credentials or tokens into source, prompts, logs, issues, or model-visible results.
          required: true
        - label: Unsupported upstream capabilities will be reported explicitly rather than fabricated.
          required: true
